# Fase final (NGINX_CONF=https): puerto 80 (reto + redirección) y 443 hacia Odoo.
# Basado en el ejemplo de nginx de la documentación de Odoo 19 (deploy.html) y
# en la de WebSocket de nginx. Requiere el certificado en
# /etc/letsencrypt/live/duran-ip/ (Certbot con --cert-name duran-ip).

# DNS interno de Docker. Con `resolve`, nginx vuelve a buscar la IP de "odoo"
# si el contenedor se recrea (si no, respondería 502 hasta reiniciar nginx).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream odoo {
    zone odoo 64k;
    server odoo:8069 resolve;
}

# Websocket de Odoo: con workers lo atiende el proceso gevent (gevent_port).
upstream odoochat {
    zone odoochat 64k;
    server odoo:8072 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Las renovaciones del certificado siguen entrando por el 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/duran-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duran-ip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Sin HSTS a propósito: si una renovación fallara, HSTS impediría entrar.

    # Adjuntos e importaciones (la documentación de Odoo no fija un valor).
    client_max_body_size 64m;

    proxy_read_timeout    720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;

    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;

    # El gestor de bases nunca se publica (además list_db = False en odoo.conf).
    location ^~ /web/database {
        return 403;
    }

    # OJO: proxy_set_header no se hereda en un location que define los suyos,
    # por eso los encabezados se repiten en cada location.
    location /websocket {
        proxy_pass http://odoochat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Todo lo demás (incluidos /captura, /captura/sw.js y /static) va a Odoo
    # sin caché de nginx: Odoo decide los encabezados (p. ej. Service-Worker-Allowed).
    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
