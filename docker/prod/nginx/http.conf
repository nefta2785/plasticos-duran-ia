# Fase inicial (NGINX_CONF=http): solo puerto 80, ANTES de tener certificado.
#
# Sirve el reto HTTP-01 de Let's Encrypt y nada más: Odoo NO se publica por
# aquí, así que el gestor de bases nunca queda expuesto mientras se prepara.

server {
    listen 80 default_server;
    server_name _;

    # Certbot (webroot, en el host) escribe aquí los archivos del reto.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "Plasticos Duran: en preparacion.\n";
    }
}
